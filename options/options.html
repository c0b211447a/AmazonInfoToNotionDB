<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Amazon to Notion Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    <div class="form-group">
      <label for="notionToken">Notion Integration Token</label>
      <input type="password" id="notionToken" placeholder="secret_...">
    </div>
    <div class="form-group">
      <label for="dbId">Database ID</label>
      <input type="text" id="dbId" placeholder="32 character ID">
    </div>
    <button id="saveBtn">Save</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <style>
        body {
            width: 320px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main View -->
        <div id="mainView">
            <div class="header">
                <div class="header-title">
                    <span class="app-icon">
                        <img src="/icons/icon48.png"></img>
                    </span>
                    Amazon to Notion
                </div>
                <button id="settingsBtn" title="設定" class="icon-btn header-button">⚙️</button>
            </div>

            <div id="loading" class="hidden">Loading...</div>

            <div id="content" class="hidden">

                <!-- Image Preview Section -->
                <div class="form-group">
                    <label><span class="label-icon">🖼️</span> 画像</label>
                    <div class="image-preview">
                        <img id="previewImg" src="" alt="Product Image">
                    </div>
                </div>

                <div class="form-group">
                    <label><span class="label-icon">📖</span> 商品名</label>
                    <input type="text" id="titleInput" placeholder="商品タイトル">
                </div>

                <div class="form-group">
                    <label><span class="label-icon">👤</span> 著者</label>
                    <input type="text" id="authorInput" placeholder="著者名">
                </div>

                <div class="form-group">
                    <label><span class="label-icon">🔗</span> URL</label>
                    <input type="text" id="urlInput" placeholder="https://...">
                </div>

                <button id="saveBtn" class="primary-btn"><span class="btn-icon">🚀</span> Notionへ保存</button>
            </div>

            <div id="message" class="hidden"></div>

            <button id="getBtn" class="secondary-btn"><span class="btn-icon">⚡</span> 情報の取得</button>
        </div>

        <!-- Settings View (Hidden by default) -->
        <div id="settingsView" class="hidden">
            <div class="header">
                <h2>Settings</h2>
                <button id="backBtn" title="戻る" class="icon-btn header-button">↩️</button>
            </div>

            <div class="form-group">
                <label for="notionToken"><span class="label-icon">🔑</span> Notion Token</label>
                <input type="password" id="notionToken" placeholder="secret_...">
            </div>

            <div class="form-group">
                <label for="dbId"><span class="label-icon">🗄️</span> Database ID</label>
                <input type="text" id="dbId" placeholder="32 character ID">
            </div>

            <button id="saveSettingsBtn" class="primary-btn"><span class="btn-icon">💾</span> 設定を保存</button>
            <div id="settingsMessage" class="hidden"></div>
        </div>

    </div>
    <script src="popup.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <style>
        body {
            width: 320px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main View -->
        <div id="mainView">
            <div class="header">
                <div class="header-title">
                    <div class="app-title">
                        <div class="app-title-line">Amazon</div>
                        <div class="app-title-line">
                            <span class="app-icon">
                                <img src="/icons/icon32.png"></img>
                            </span>To
                        </div>
                        <div class="app-title-line">Notion</div>
                    </div>
                </div>
                <button id="settingsBtn" title="Settings" class="icon-btn header-button">⚙️</button>
            </div>

            <div id="loading" class="hidden">Loading...</div>

            <div id="content" class="hidden">

                <!-- Image Preview Section -->
                <div class="form-group">
                    <label><span class="label-icon">🖼️</span> Image</label>
                    <div class="image-preview">
                        <img id="previewImg" src="" alt="Product Image">
                    </div>
                </div>

                <div class="form-group">
                    <label><span class="label-icon">📖</span> Title</label>
                    <input type="text" id="titleInput" placeholder="Title">
                </div>

                <div class="form-group">
                    <label><span class="label-icon">👤</span> Author</label>
                    <input type="text" id="authorInput" placeholder="Author">
                </div>

                <div class="form-group">
                    <label><span class="label-icon">🔗</span> URL</label>
                    <input type="text" id="urlInput" placeholder="https://...">
                </div>

                <button id="saveBtn" class="primary-btn"><span class="btn-icon">🚀</span> Save to Notion</button>
            </div>

            <div id="message" class="hidden"></div>

            <button id="getBtn" class="secondary-btn"><span class="btn-icon">⚡</span> Get Information</button>
        </div>

        <!-- Settings View (Hidden by default) -->
        <div id="settingsView" class="hidden">
            <div class="header">
                <h2>Settings</h2>
                <button id="backBtn" title="Back" class="icon-btn header-button">↩️</button>
            </div>

            <div class="form-group">
                <label for="notionToken"><span class="label-icon">🔑</span> Notion Token</label>
                <input type="password" id="notionToken" placeholder="secret_...">
            </div>

            <div class="form-group">
                <label for="dbId"><span class="label-icon">🗄️</span> Database ID</label>
                <input type="text" id="dbId" placeholder="32 character ID">
            </div>

            <button id="saveSettingsBtn" class="primary-btn"><span class="btn-icon">💾</span> Save Settings</button>
            <div id="settingsMessage" class="hidden"></div>
        </div>

    </div>
    <script src="popup.js"></script>
</body>

</html>
